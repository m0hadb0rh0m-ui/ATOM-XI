name: V2 Backend Tests
on:
  push:
    branches: [feature/atom-ai-x-v2]
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r v2/backend/requirements.txt
      - name: Syntax check
        run: python -m compileall -q v2/backend
      - name: Run tests
        working-directory: v2/backend
        run: python -m pytest -q
