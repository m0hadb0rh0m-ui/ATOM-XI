<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B0D12"><title>ATOM AI X — Workspace</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="orb">✧</span><div><strong>ATOM AI X</strong><small>QUANTUM INTELLIGENCE</small></div></div><button class="primary" id="newChat">＋ محادثة جديدة</button><nav id="nav" aria-label="التنقل الرئيسي"></nav><div class="sidebar-footer"><button id="themeToggle">◐ <span data-i18n="appearance">المظهر</span></button><button id="languageToggle">عربي / EN</button></div></aside>
<div class="main"><header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button><div><strong id="pageTitle">المحادثة</strong><span class="subtle" id="status">● واجهة تجريبية — الاتصال يتطلب إعداد الخادم</span></div><div class="top-actions"><button class="icon-btn" id="searchBtn" title="البحث">⌕</button><button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙</button></div></header>
<main id="screen" tabindex="-1"></main><div class="composer-wrap" id="composerWrap"><div class="composer"><div class="composer-tools"><label for="mode">الوضع</label><select id="mode"><option value="quick">سريع</option><option value="balanced">متوازن</option><option value="deep">تفكير عميق</option><option value="creative">إبداعي</option><option value="sources">دقيق للمصادر</option></select><label for="model">النموذج</label><span id="model">Gemini</span></div><textarea id="prompt" rows="2" placeholder="اسأل أو اكتب طلبك هنا..." aria-label="رسالتك"></textarea><div class="composer-bottom"><span id="draftState" class="subtle">المسودة محفوظة محليًا</span><div><button class="icon-btn" id="stopBtn" hidden>■</button><button class="send" id="sendBtn" aria-label="إرسال">➤</button></div></div></div><p class="disclaimer">قد يخطئ الذكاء الاصطناعي. راجع المعلومات المهمة.</p></div>
<nav id="mobileNav" aria-label="التنقل على الهاتف"></nav></div></div><dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog">إغلاق</button></dialog><script src="app.js" defer></script></body></html>
